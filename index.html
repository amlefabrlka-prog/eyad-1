    <title>Flappy Bird Game</title>

        h1 { margin: 5px; text-shadow: 2px 2px #333; font-size: 24px; }
        canvas { background-color: #70c5ce; border: 4px solid #fff; border-radius: 10px; width: 320px; height: 380px; }
        .controls { margin-top: 15px; }
        .jump-btn { width: 130px; height: 60px; background-color: #ff9800; color: white; border: 3px solid #fff; border-radius: 50px; font-size: 22px; font-weight: bold; cursor: pointer; box-shadow: 0 4px #e65100; }
        .jump-btn:active { transform: translateY(2px); box-shadow: 0 2px #e65100; }
    </style>
</head>

    <div style="font-size: 20px; font-weight: bold; margin-bottom: 10px; text-shadow: 1px 1px #000;">النقاط: <span id="score">0</span></div>

    <canvas id="birdCanvas" width="360" height="420"></canvas>

    <div class="controls">
        <button class="jump-btn" onclick="jump()">قفز! 🚀</button>
    </div>

        let gameOver = false;
        let bird = { x: 50, y: 150, w: 24, h: 24, g: 0.4, v: 0, j: -6.5 };
        let pipes = [];
        const pWidth = 50;
        const pGap = 120;
        const pSpeed = 2;

        function makePipe() {
            let topH = Math.floor(Math.random() * (canvas.height - pGap - 80)) + 30;
            pipes.push({ x: canvas.width, top: topH, bottom: canvas.height - topH - pGap });
        }

        function jump() {
            if (gameOver) {
                reset();
            } else {
                bird.v = bird.j;
            }
        }

            bird.y += bird.v;

            }

                makePipe();
            }
