<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛸 حرب الفضاء المدمرة</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #0b0b1a; color: #fff; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; overflow: hidden; }
        h1 { margin: 5px 0; color: #00e5ff; font-size: 22px; text-shadow: 0 0 10px #00e5ff; }
        #stats { display: flex; gap: 20px; font-size: 16px; margin-bottom: 10px; font-weight: bold; }
        #score { color: #ffeb3b; }
        #health { color: #ff5252; }
        canvas { background: radial-gradient(circle, #151530 0%, #050510 100%); border: 3px solid #00e5ff; border-radius: 8px; box-shadow: 0 0 20px rgba(0, 229, 255, 0.3); width: 320px; height: 350px; }
        .controls { display: grid; grid-template-columns: repeat(3, 70px); grid-gap: 15px; margin-top: 15px; justify-content: center; width: 100%; }
        .btn { width: 70px; height: 60px; background-color: #222; color: white; border: 2px solid #00e5ff; border-radius: 10px; font-size: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center; -webkit-tap-highlight-color: transparent; }
        .btn:active { background-color: #00e5ff; }
        .shoot-btn { grid-column: 2; background-color: #ff5252; border-color: #ff5252; }
        .shoot-btn:active { background-color: #ff1744; }
    </style>
</head>
<body>

    <h1>🚀 حرب الفضاء المجنونة</h1>
    <div id="stats">
        <div>النقاط: <span id="score">0</span></div>
        <div>الصحة: <span id="health">100%</span></div>
    </div>

    <!-- ساحة المعركة -->
    <canvas id="spaceCanvas" width="400" height="450"></canvas>

    <!-- أزرار التحكم للموبايل -->
    <div class="controls">
        <button class="btn" onclick="moveShip(-20)">⬅️</button>
        <button class="btn shoot-btn" onclick="shootLaser()">🔥</button>
        <button class="btn" onclick="moveShip(20)">➡️</button>
    </div>

    <script>
        const canvas = document.getElementById("spaceCanvas");
        const ctx = canvas.getContext("2d");

        let score = 0;
        let health = 100;

        // مركبتك الفضائية
        const player = { x: canvas.width / 2 - 20, y: canvas.height - 60, width: 40, height: 40, color: "#00e5ff" };

        let lasers = [];
        let enemies = [];
        let gameInterval;

        // تحريك المركبة يميناً ويساراً من الأزرار
        function moveShip(dir) {
            player.x += dir;
            if (player.x < 0) player.x = 0;
            if (player.x > canvas.width - player.width) player.x = canvas.width - player.width;
        }

        // إطلاق الليزر عند الضغط على زر النار
        function shootLaser() {
            lasers.push({ x: player.x + player.width / 2 - 3, y: player.y, width: 6, height: 15, color: "#ff5252" });
        }

        // توليد الأعداء بشكل عشوائي من الأعلى
        function createEnemy() {
            if (Math.random() < 0.04) {
                let size = 30;
                let x = Math.random() * (canvas.width - size);
                enemies.push({ x: x, y: -size, width: size, height: size, color: "#aeea00", speed: 2 + Math.random() * 2 });
            }
        }

        function update() {
            createEnemy();

            // تحريك الليزر للأعلى وحذفه إذا خرج من الشاشة
            lasers.forEach((laser, lIndex) => {
                laser.y -= 7;
                if (laser.y < 0) lasers.splice(lIndex, 1);
            });

            // تحريك الأعداء للأسفل
            enemies.forEach((enemy, eIndex) => {
                enemy.y += enemy.speed;

                // إذا وصل العدو لأسفل الشاشة (تخطي خط دفاعك)
                if (enemy.y > canvas.height) {
                    enemies.splice(eIndex, 1);
                    health -= 10;
                    updateStats();
                }

                // اصطدام العدو بمركبتك مباشرة
                if (checkCollision(player, enemy)) {
                    enemies.splice(eIndex, 1);
                    health -= 20;
                    updateStats();
                }

                // اصطدام الليزر بالعدو (تدميره)
                lasers.forEach((laser, lIndex) => {
                    if (checkCollision(laser, enemy)) {
                        enemies.splice(eIndex, 1);
                        lasers.splice(lIndex, 1);
                        score += 10;
                        updateStats();
                    }
                });
            });

            // التحقق من انتهاء اللعبة
            if (health <= 0) {
                clearInterval(gameInterval);
                alert("تم تدمير مركبتك! مجموع نقاطك: " + score);
                resetGame();
            }
        }

        // دالة رسم العناصر
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // رسم مركبة اللاعب (شكل مثلثي متطور)
            ctx.fillStyle = player.color;
            ctx.beginPath();
            ctx.moveTo(player.x + player.width / 2, player.y);
            ctx.lineTo(player.x, player.y + player.height);
            ctx.lineTo(player.x + player.width, player.y + player.height);
            ctx.closePath();
            ctx.fill();

            // رسم الليزر
            lasers.forEach(laser => {
                ctx.fillStyle = laser.color;
                ctx.fillRect(laser.x, laser.y, laser.width, laser.height);
            });

            // رسم الأعداء (الوحوش الفضائية)
            enemies.forEach(enemy => {
                ctx.fillStyle = enemy.color;
                ctx.fillRect(enemy.x, enemy.y, enemy.width, enemy.height);
                // ملامح بسيطة للوحش
                ctx.fillStyle = "#000";
                ctx.fillRect(enemy.x + 5, enemy.y + 8, 5, 5);
                ctx.fillRect(enemy.x + 20, enemy.y + 8, 5, 5);
            });
        }

        // دالة التحقق من التصادم بين عنصرين
        function checkCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }

        function updateStats() {
            document.getElementById("score").innerText = score;
            document.getElementById("health").innerText = Math.max(0, health) + "%";
        }

        function resetGame() {
            score = 0;
            health = 100;
            lasers = [];
            enemies = [];
            player.x = canvas.width / 2 - 20;
            updateStats();
            gameInterval = setInterval(gameLoop, 1000 / 60);
        }

        function gameLoop() {
            update();
            draw();
        }

        // بدء اللعبة
        gameInterval = setInterval(gameLoop, 1000 / 60);
    </script>
</body>
</html>
